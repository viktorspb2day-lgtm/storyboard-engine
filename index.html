<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>STORYBOARD ENGINE v29.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: monospace; }
        .ui-card { background: #080808; border: 1px solid #222; border-radius: 12px; }
        .loader { width: 30px; height: 30px; border: 3px solid #333; border-top-color: #f97316; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col p-4 gap-4 overflow-hidden">

    <header class="h-16 flex items-center justify-between px-6 ui-card">
        <h1 class="text-orange-600 font-bold text-[10px] uppercase tracking-widest">Engine v29.0 [Direct Mode]</h1>
        <button onclick="run()" class="bg-orange-600 px-10 py-2 rounded-full text-[10px] font-black uppercase">Запуск</button>
    </header>

    <main class="flex flex-1 gap-4 overflow-hidden">
        <textarea id="in" class="w-1/2 p-6 bg-black border border-zinc-900 rounded-xl outline-none text-zinc-500 focus:text-white resize-none" placeholder="Вставьте текст сценария..."></textarea>
        <div id="deck" class="w-1/2 overflow-y-auto space-y-4"></div>
    </main>

    <script>
        const KEY = "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";

        async function run() {
            const txt = document.getElementById('in').value;
            const deck = document.getElementById('deck');
            if(!txt) return;
            deck.innerHTML = "";

            const id = Date.now();
            const card = document.createElement('div');
            card.className = "ui-card p-6 border-l-2 border-orange-600";
            card.innerHTML = `
                <div class="flex justify-between text-[9px] text-zinc-600 mb-2 uppercase"><span>Кадр #1</span><span id="st-${id}">Рендер...</span></div>
                <div id="bx-${id}" class="aspect-video bg-zinc-950 rounded flex items-center justify-center border border-white/5 overflow-hidden mb-4">
                    <div class="loader"></div>
                </div>
                <div id="link-${id}" class="hidden mb-4 p-3 bg-orange-950/20 border border-orange-900/50 rounded text-center">
                    <a id="url-${id}" href="#" target="_blank" class="text-orange-500 text-[11px] font-bold uppercase underline">Нажми сюда, чтобы увидеть картинку</a>
                </div>
                <p id="pr-${id}" class="text-[11px] text-zinc-500 italic"></p>
            `;
            deck.appendChild(card);

            try {
                const g = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + KEY, "Content-Type": "application/json" },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{role: "system", content: "Cinematic prompt, English."}, {role: "user", content: txt}] })
                });
                const gd = await g.json();
                const prompt = gd.choices[0].message.content.trim();
                document.getElementById('pr-'+id).innerText = prompt;

                const seed = Math.floor(Math.random() * 99999);
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1280&height=720&seed=${seed}&nologo=true`;
                
                // Подготавливаем запасную ссылку
                document.getElementById('url-'+id).href = url;
                document.getElementById('link-'+id).classList.remove('hidden');

                const img = new Image();
                img.src = url;
                img.className = "w-full h-full object-cover";
                img.onload = () => {
                    document.getElementById('bx-'+id).innerHTML = "";
                    document.getElementById('bx-'+id).appendChild(img);
                    document.getElementById('st-'+id).innerText = "ГОТОВО";
                    document.getElementById('link-'+id).classList.add('hidden'); // Убираем ссылку, если всё ок
                };
            } catch (e) { document.getElementById('st-'+id).innerText = "ОШИБКА"; }
        }
    </script>
</body>
</html>
