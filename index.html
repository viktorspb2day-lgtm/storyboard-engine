<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>STORYBOARD ENGINE v28.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: ui-monospace, monospace; }
        .canvas { background: #050505; border: 1px solid #1a1a1a; border-radius: 20px; }
        .loader { width: 30px; height: 30px; border: 3px solid #333; border-top-color: #f97316; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col p-6 overflow-hidden">

    <header class="h-16 flex items-center justify-between px-8 canvas mb-4">
        <h1 class="text-orange-600 font-bold text-[10px] uppercase tracking-[0.5em]">Ultimate Engine v28.0</h1>
        <button onclick="ignite()" class="bg-orange-600 hover:bg-orange-500 text-white px-12 py-2 rounded-full font-black text-[10px] uppercase transition-all shadow-lg shadow-orange-900/20">Запуск рендера</button>
    </header>

    <main class="flex flex-1 gap-6 overflow-hidden">
        <textarea id="ed" class="w-1/3 p-8 bg-black/50 border border-zinc-900 rounded-[30px] outline-none text-zinc-500 focus:text-white transition-all resize-none" placeholder="Вставьте ваш сценарий..."></textarea>
        <div id="deck" class="w-2/3 overflow-y-auto space-y-6 pr-4">
            <div class="h-full flex items-center justify-center text-[10px] text-zinc-800 uppercase tracking-widest">Ожидание сценария</div>
        </div>
    </main>

    <script>
        const GROQ_KEY = "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";

        async function ignite() {
            const text = document.getElementById('ed').value;
            const deck = document.getElementById('deck');
            if(!text) return;
            deck.innerHTML = "";

            const id = Date.now();
            const card = document.createElement('div');
            card.className = "canvas p-8 border-l-4 border-orange-600";
            card.innerHTML = `
                <div class="flex justify-between mb-4 text-[9px] font-bold text-zinc-600 uppercase"><span>Кадр #1</span><span id="st-${id}">Обработка...</span></div>
                <div id="bx-${id}" class="aspect-video bg-black rounded-xl flex items-center justify-center overflow-hidden border border-white/5 shadow-inner">
                    <div class="loader"></div>
                </div>
                <div id="pr-${id}" class="mt-6 text-[11px] text-zinc-500 italic leading-relaxed"></div>
            `;
            deck.appendChild(card);

            try {
                // Получаем промпт
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + GROQ_KEY, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{role: "system", content: "Cinematic storyboard shot description, English, high detail."}, {role: "user", content: text}]
                    })
                });
                const data = await res.json();
                const prompt = data.choices[0].message.content.trim();
                document.getElementById('pr-'+id).innerText = prompt;

                // Создаем картинку самым простым способом
                const seed = Math.floor(Math.random() * 99999);
                const finalUrl = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) + "?width=1280&height=720&seed=" + seed + "&nologo=true";
                
                const img = document.createElement('img');
                img.src = finalUrl;
                img.className = "w-full h-full object-cover";
                img.onload = () => {
                    document.getElementById('bx-'+id).innerHTML = "";
                    document.getElementById('bx-'+id).appendChild(img);
                    document.getElementById('st-'+id).innerText = "ГОТОВО";
                };
                img.onerror = () => {
                    // Если не вышло, пробуем через "внешнюю ссылку"
                    document.getElementById('st-'+id).innerText = "СБОЙ СЕТИ";
                    document.getElementById('bx-'+id).innerHTML = `<a href="${finalUrl}" target="_blank" class="text-[10px] text-orange-600 underline">Нажмите здесь, чтобы открыть кадр в новом окне</a>`;
                };

            } catch (e) {
                document.getElementById('st-'+id).innerText = "ОШИБКА";
            }
        }
    </script>
</body>
</html>
