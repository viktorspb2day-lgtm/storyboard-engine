<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>STORYBOARD ULTIMATE v27.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #eee; font-family: 'Courier New', monospace; }
        .card { background: #0a0a0a; border: 1px solid #333; border-radius: 12px; margin-bottom: 20px; padding: 20px; }
        .img-box { width: 100%; aspect-ratio: 16/9; background: #050505; border-radius: 8px; display: flex; items-center; justify-center; overflow: hidden; border: 1px solid #1a1a1a; }
        .loader { width: 40px; height: 40px; border: 3px solid #222; border-top-color: #ea580c; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-orange-600 font-bold tracking-tighter">ENGINE v27.0 [STABLE]</h1>
            <button onclick="generate()" class="bg-orange-600 hover:bg-orange-500 text-white px-8 py-2 rounded-full font-bold uppercase text-xs transition-all">Сгенерировать кадр</button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <textarea id="textInput" class="h-[70vh] bg-zinc-950 border border-zinc-800 p-6 rounded-xl outline-none focus:border-orange-900 transition-colors" placeholder="Вставьте сценарий сюда..."></textarea>
            <div id="output" class="h-[70vh] overflow-y-auto pr-2">
                <div class="text-zinc-700 text-center mt-20 text-xs tracking-widest uppercase">Готов к работе</div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "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";

        async function generate() {
            const input = document.getElementById('textInput').value;
            if(!input) return alert("Введите текст");
            
            const out = document.getElementById('output');
            out.innerHTML = `<div class="card"><div class="img-box"><div class="loader"></div></div><p class="mt-4 text-xs text-zinc-500 animate-pulse">ИИ анализирует текст...</p></div>`;

            try {
                // 1. ПОЛУЧАЕМ ОПИСАНИЕ
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + API_KEY, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{role: "system", content: "Create a short, vivid visual prompt in English for a cinematic shot."}, {role: "user", content: input}]
                    })
                });
                const data = await res.json();
                const prompt = data.choices[0].message.content.trim();
                
                // 2. ПРОБУЕМ ЗАГРУЗИТЬ КАРТИНКУ ЧЕРЕЗ РАЗНЫЕ ШЛЮЗЫ
                const seed = Math.floor(Math.random() * 100000);
                
                // Шлюз 1 (Основной)
                const url1 = `https://pollinations.ai/p/${encodeURIComponent(prompt)}?width=1024&height=576&seed=${seed}&model=flux&nologo=true`;
                // Шлюз 2 (Альтернативный)
                const url2 = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&width=1024&height=576&nologo=true`;

                out.innerHTML = `
                    <div class="card">
                        <div class="img-box" id="imgContainer">
                            <img src="${url1}" class="w-full h-full object-cover" 
                                 onerror="this.onerror=null; this.src='${url2}'; console.log('Переключение на резервный сервер...');"
                                 onload="document.getElementById('status').innerText='КАДР ГОТОВ';">
                        </div>
                        <div class="flex justify-between mt-4">
                            <span id="status" class="text-[10px] text-orange-600 font-bold uppercase">Загрузка...</span>
                        </div>
                        <p class="mt-2 text-sm text-zinc-400 leading-relaxed">${prompt}</p>
                    </div>
                `;
            } catch (e) {
                out.innerHTML = `<div class="card text-red-900 text-xs">ОШИБКА СЕТИ. Проверьте интернет.</div>`;
            }
        }
    </script>
</body>
</html>
